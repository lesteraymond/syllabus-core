# Dependabot proposes updates as pull requests; nothing is merged automatically. It keeps the pinned GitHub Actions (by commit hash, see workflows/ci.yml)
# current, and flags vulnerable npm packages in the app (root) and the server.
# Version updates are monthly and grouped, so there is one pull request per folder instead of one per package. Security updates are not held back by this.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      app-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      server-deps:
        patterns: ["*"]
