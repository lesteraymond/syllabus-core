# Dependabot proposes updates as pull requests; nothing is merged automatically. It keeps the pinned GitHub Actions (by commit hash, see workflows/ci.yml)
# current, and flags vulnerable npm packages in the app (root) and the server.
# Version-update pull requests are turned off (limit 0). Security updates for vulnerable packages still open pull requests, because they use their own limit.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      app-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      server-deps:
        patterns: ["*"]
